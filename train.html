<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Motion Physics Simulator - Relative Motion</title>
    <style>
        :root {
            --bg-dark: #080c14;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --accent-cyan: #38bdf8;
            --accent-green: #4ade80;
            --accent-rose: #f43f5e;
            --accent-amber: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at top, #111827, #0f172a, #030712);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2.1rem;
            font-weight: 800;
            background: linear-gradient(to right, #fbbf24, #f97316, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(251, 191, 36, 0.3);
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .main-wrapper {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(2, 6, 23, 0.5);
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .control-item label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent-amber);
        }

        .control-item input[type="number"] {
            width: 100%;
            padding: 6px 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .control-item input[type="number"]:focus {
            border-color: var(--accent-amber);
        }

        .toggle-group {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            grid-column: 1 / -1;
            margin-top: 5px;
            flex-wrap: wrap;
        }

        .toggle-label {
            font-size: 0.85rem;
            color: #cbd5e1;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            grid-column: 1 / -1;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-start {
            background: linear-gradient(135deg, #d97706, #ea580c);
            color: white;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4);
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(217, 119, 6, 0.6);
        }

        .btn-horn { background: #0284c7; color: #fff; }
        .btn-horn:hover { background: #0369a1; }

        .btn-reset { background: #334155; color: #f1f5f9; }
        .btn-reset:hover { background: #475569; }

        .canvas-container {
            position: relative;
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }

        canvas {
            width: 100%;
            height: 440px;
            display: block;
            background: #050811;
        }

        .hud-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .hud-card {
            background: rgba(2, 6, 23, 0.6);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .hud-title { font-size: 0.75rem; color: #94a3b8; }
        .hud-val { font-size: 1.1rem; font-weight: 700; color: var(--accent-green); margin-top: 2px; }

        .result-banner {
            display: none;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: 700;
            font-size: 0.95rem;
            margin-top: 10px;
            animation: fadeIn 0.3s ease-in;
            line-height: 1.5;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .res-success { background: rgba(34, 197, 94, 0.15); border: 1px solid var(--accent-green); color: var(--accent-green); }
        .res-roof { background: rgba(251, 191, 36, 0.18); border: 1px solid var(--accent-amber); color: #fde047; }
        .res-behind { background: rgba(244, 63, 94, 0.15); border: 1px solid var(--accent-rose); color: #fca5a5; }
    </style>
</head>
<body>

    <header>
        <h1>🚂 Train Motion Physics Simulator</h1>
        <p class="subtitle">චලනය වන දුම්රියකින් ඉහළට විසි කළ වස්තුවක සාපේක්ෂ චලිතය</p>
    </header>

    <div class="main-wrapper">
        <div class="glass-panel">
            <div class="controls-grid">
                <div class="control-item">
                    <label for="v_train">දුම්රියේ ප්‍රවේගය (m/s)</label>
                    <input type="number" id="v_train" value="50" step="5">
                </div>
                <div class="control-item">
                    <label for="u_y">බෝලයේ සිරස් ප්‍රවේගය (m/s)</label>
                    <input type="number" id="u_y" value="25" step="5">
                </div>
                <div class="control-item">
                    <label for="acc">දුම්රියේ ත්වරණය (m/s²)</label>
                    <input type="number" id="acc" value="0" step="1">
                </div>
                <div class="control-item">
                    <label for="gravity">ගුරුත්වජ ත්වරණය g (m/s²)</label>
                    <input type="number" id="gravity" value="10" step="0.5">
                </div>

                <div class="toggle-group">
                    <label class="toggle-label">
                        <input type="checkbox" id="chkVectors" checked> Velocity Vectors පෙන්වන්න
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="chkSound" checked> Sound Effects
                    </label>
                </div>

                <div class="btn-group">
                    <button class="btn-start" onclick="startSimulation()">🚀 Start Simulation</button>
                    <button class="btn-horn" onclick="playTrainHorn()">📢 Train Horn</button>
                    <button class="btn-reset" onclick="resetSimulation()">🔄 Reset</button>
                </div>
            </div>

            <div class="canvas-container" style="margin-top: 15px;">
                <canvas id="simCanvas" width="960" height="440"></canvas>
            </div>

            <div class="hud-grid">
                <div class="hud-card">
                    <div class="hud-title">ගතවූ කාලය (t)</div>
                    <div class="hud-val" id="hud-time">0.00 s</div>
                </div>
                <div class="hud-card">
                    <div class="hud-title">බෝලය ගිය දුර (S<sub>ball</sub>)</div>
                    <div class="hud-val" id="hud-ball">0.0 m</div>
                </div>
                <div class="hud-card">
                    <div class="hud-title">දුම්රිය ගිය දුර (S<sub>train</sub>)</div>
                    <div class="hud-val" id="hud-train">0.0 m</div>
                </div>
                <div class="hud-card">
                    <div class="hud-title">සාපේක්ෂ දුර (&Delta;S)</div>
                    <div class="hud-val" id="hud-diff">0.0 m</div>
                </div>
            </div>

            <div id="resultBox" class="result-banner"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const scale = 2.2; // 1 meter = 2.2 pixels
        const groundY = 350; // Ground Y position
        const handHeightPx = 46; // Height of person's hand above ground in pixels
        const handHeightMeters = handHeightPx / scale;

        function playTrainHorn() {
            if (!document.getElementById('chkSound').checked) return;
            try {
                let now = audioCtx.currentTime;
                [311.13, 369.99, 622.25].forEach(freq => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    let filter = audioCtx.createBiquadFilter();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now);
                    filter.type = 'lowpass';
                    filter.frequency.value = 1100;

                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioCtx.destination);

                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.12, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now + 0.7);
                    gain.gain.linearRampToValueAtTime(0, now + 1.0);

                    osc.start(now);
                    osc.stop(now + 1.0);
                });
            } catch(e){}
        }

        function playSound(type) {
            if (!document.getElementById('chkSound').checked) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'throw') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                } else if (type === 'land') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                }
            } catch(e){}
        }

        let animationFrame = null;
        let isRunning = false;
        let ballTrail = [];
        let smokeParticles = [];
        let throwArmAngle = 0;
        let isThrowingAnim = false;

        function startSimulation() {
            if (isRunning || isThrowingAnim) return;

            let v_train_0 = parseFloat(document.getElementById('v_train').value);
            let u_y = parseFloat(document.getElementById('u_y').value);
            let a_train = parseFloat(document.getElementById('acc').value);
            let g = parseFloat(document.getElementById('gravity').value);

            let t = 0;
            let dt = 0.025;
            let startPos = 160;

            let personX = startPos;
            let ballX = startPos;
            let ballY = handHeightMeters;

            ballTrail = [];
            smokeParticles = [];
            document.getElementById('resultBox').style.display = 'none';

            playTrainHorn();

            isThrowingAnim = true;
            let armProgress = 0;

            function animate() {
                if (isThrowingAnim) {
                    armProgress += 0.08;
                    throwArmAngle = Math.sin(armProgress * Math.PI) * 1.2;

                    if (armProgress >= 0.5 && isThrowingAnim && armProgress < 0.58) {
                        playSound('throw');
                    }

                    if (armProgress >= 1.0) {
                        isThrowingAnim = false;
                        isRunning = true;
                    }
                }

                if (isRunning) {
                    throwArmAngle = 0;
                    t += dt;

                    // Exact physics tracking
                    personX = startPos + (v_train_0 * t + 0.5 * a_train * t * t);
                    ballX = startPos + (v_train_0 * t);
                    
                    let relY = u_y * t - 0.5 * g * t * t;
                    ballY = handHeightMeters + relY;

                    if (relY >= 0) {
                        ballTrail.push({ x: ballX, y: ballY });
                    }

                    // Smoke emitting directly from Engine Chimney (+82px relative to person)
                    if (Math.random() < 0.85) {
                        let chimneyWorldX = personX + (82 / scale);
                        let chimneyWorldY = 48 / scale;

                        smokeParticles.push({
                            x: chimneyWorldX,
                            y: chimneyWorldY,
                            vx: -1.2 - Math.random() * 0.8,
                            vy: 0.5 + Math.random() * 0.4,
                            size: 3 + Math.random() * 3,
                            alpha: 0.75
                        });
                    }

                    let s_train = v_train_0 * t + 0.5 * a_train * t * t;
                    let s_ball = v_train_0 * t;
                    let diff = s_ball - s_train;

                    document.getElementById('hud-time').innerText = t.toFixed(2) + ' s';
                    document.getElementById('hud-ball').innerText = s_ball.toFixed(1) + ' m';
                    document.getElementById('hud-train').innerText = s_train.toFixed(1) + ' m';
                    document.getElementById('hud-diff').innerText = Math.abs(diff).toFixed(1) + ' m';

                    // Landed back at hand height
                    if (relY <= 0 && t > 0.1) {
                        isRunning = false;
                        ballY = handHeightMeters;
                        playSound('land');
                        showResult(diff, a_train);
                    }
                }

                drawScene(personX, ballX, ballY, t, v_train_0 + a_train * t, u_y - g * t);

                if (isRunning || isThrowingAnim) {
                    animationFrame = requestAnimationFrame(animate);
                }
            }

            animate();
        }

        function drawScene(personX, ballX, ballY, time, curTrainVx, curBallVy) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Center camera between Person and Ball
            let centerPos = (personX + ballX) / 2;
            const cameraX = centerPos - canvas.width / (2 * scale);

            // Night Sky Gradient
            let skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
            skyGrad.addColorStop(0, '#030712');
            skyGrad.addColorStop(0.5, '#0b1329');
            skyGrad.addColorStop(1, '#1e293b');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, groundY);

            // Moon
            ctx.fillStyle = '#fef08a';
            ctx.beginPath();
            ctx.arc(canvas.width - 120, 65, 26, 0, Math.PI * 2);
            ctx.fill();

            // Mountains
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            for (let i = -50; i <= canvas.width + 50; i += 50) {
                let mtnH = Math.sin((i + cameraX * 0.1) * 0.006) * 55 + 65;
                ctx.lineTo(i, groundY - mtnH);
            }
            ctx.lineTo(canvas.width, groundY);
            ctx.fill();

            // Railway Telegraph Poles
            for (let i = -300; i <= 3000; i += 220) {
                let poleX = (i - cameraX) * scale;
                if (poleX > -50 && poleX < canvas.width + 50) {
                    ctx.strokeStyle = '#475569';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(poleX, groundY - 10);
                    ctx.lineTo(poleX, groundY - 95);
                    ctx.moveTo(poleX - 12, groundY - 80);
                    ctx.lineTo(poleX + 12, groundY - 80);
                    ctx.stroke();
                }
            }

            // Ground & Ballast
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, groundY - 10, canvas.width, canvas.height - groundY + 10);

            // Railway Sleepers
            ctx.fillStyle = '#451a03';
            for (let s = -200; s <= 3000; s += 14) {
                let sleeperX = (s - cameraX) * scale;
                if (sleeperX >= -20 && sleeperX <= canvas.width + 20) {
                    ctx.fillRect(sleeperX, groundY - 5, 7, 7);
                }
            }

            // Metal Rails
            ctx.fillStyle = '#94a3b8';
            ctx.fillRect(0, groundY - 8, canvas.width, 3);
            ctx.fillRect(0, groundY - 1, canvas.width, 3);

            // Distance Markers
            ctx.fillStyle = '#64748b';
            ctx.font = '600 11px sans-serif';
            for (let m = 0; m <= 3000; m += 20) {
                let screenX = (m - cameraX) * scale;
                if (screenX >= -20 && screenX <= canvas.width + 20) {
                    ctx.fillText(m + 'm', screenX - 8, groundY + 20);
                }
            }

            // Smoke Particles
            for (let i = smokeParticles.length - 1; i >= 0; i--) {
                let p = smokeParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.012;
                if (p.alpha <= 0) {
                    smokeParticles.splice(i, 1);
                    continue;
                }
                let px = (p.x - cameraX) * scale;
                let py = groundY - (p.y * scale);
                ctx.fillStyle = `rgba(226, 232, 240, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(px, py, p.size, 0, Math.PI * 2);
                ctx.fill();
            }

            // Trajectory Trail
            if (ballTrail.length > 1) {
                ctx.beginPath();
                ctx.strokeStyle = '#f43f5e';
                ctx.lineWidth = 3;
                ctx.setLineDash([5, 5]);
                for (let i = 0; i < ballTrail.length; i++) {
                    let ptX = (ballTrail[i].x - cameraX) * scale;
                    let ptY = groundY - (ballTrail[i].y * scale);
                    if (i === 0) ctx.moveTo(ptX, ptY);
                    else ctx.lineTo(ptX, ptY);
                }
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Draw Train centered around Person's exact position
            let personScreenX = (personX - cameraX) * scale;
            drawSynchronizedTrain(personScreenX, groundY, personX);

            // Draw Ball from exact hand position
            let ballScreenX = (ballX - cameraX) * scale;
            let ballScreenY = groundY - (ballY * scale);

            if (ballY >= 0) {
                ctx.shadowColor = '#f43f5e';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(ballScreenX, ballScreenY, 7.5, 0, Math.PI * 2);
                ctx.fillStyle = '#fb7185';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#fff';
                ctx.stroke();
                ctx.shadowBlur = 0;

                if (document.getElementById('chkVectors').checked && isRunning) {
                    let v_train_0 = parseFloat(document.getElementById('v_train').value);
                    drawArrow(ballScreenX, ballScreenY, ballScreenX + v_train_0 * 0.8, ballScreenY, '#38bdf8', 'Vx');
                    drawArrow(ballScreenX, ballScreenY, ballScreenX, ballScreenY - curBallVy * 0.8, '#4ade80', 'Vy');
                }
            }
        }

        // --- DRAW TRAIN SYNCHRONIZED EXACTLY WITH PERSON AT X=0 ---
        function drawSynchronizedTrain(x, y, dist) {
            ctx.save();
            ctx.translate(x, y); // Local origin is EXACTLY Person's position on rail level!

            const coachW = 35;
            const coachH = 26;

            // 1. COACHES
            // Coach 3 (Rearmost)
            drawCoach(-52.5, -10 - coachH, coachW, coachH, '#1e3a8a');
            // Coach 2 (Middle Coach - Person stands on center X=0)
            drawCoach(-17.5, -10 - coachH, coachW, coachH, '#1e3a8a');
            // Coach 1 (Front Passenger Coach)
            drawCoach(17.5, -10 - coachH, coachW, coachH, '#1e3a8a');

            // 2. ENGINE
            ctx.fillStyle = '#b91c1c';
            ctx.fillRect(52.5, -10 - coachH, 38, coachH);
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 1.2;
            ctx.strokeRect(52.5, -10 - coachH, 38, coachH);

            // Cabin Roof & Chimney
            ctx.fillStyle = '#991b1b';
            ctx.fillRect(55.5, -10 - coachH - 5, 18, 5);
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(80, -10 - coachH - 10, 6, 10);
            ctx.fillRect(78, -10 - coachH - 12, 10, 3);

            // Engine Nose Grille & Headlight
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.moveTo(90.5, -10 - coachH);
            ctx.lineTo(99.5, -22);
            ctx.lineTo(90.5, -13);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#fde047';
            ctx.beginPath();
            ctx.arc(90.5, -22, 4, 0, Math.PI * 2);
            ctx.fill();

            // Headlight Cone Beam
            let lightGlow = ctx.createRadialGradient(92.5, -22, 2, 210, -22, 70);
            lightGlow.addColorStop(0, 'rgba(253, 224, 71, 0.65)');
            lightGlow.addColorStop(1, 'rgba(253, 224, 71, 0)');
            ctx.fillStyle = lightGlow;
            ctx.beginPath();
            ctx.moveTo(92.5, -26);
            ctx.lineTo(220, -10);
            ctx.lineTo(220, 0);
            ctx.lineTo(92.5, -16);
            ctx.closePath();
            ctx.fill();

            // 3. PERSON (Centered EXACTLY at X=0)
            ctx.save();
            ctx.translate(0, -10 - coachH); // Standing on middle coach roof

            // Body
            ctx.fillStyle = '#0284c7';
            ctx.fillRect(-5, -12, 10, 12);

            // Head
            ctx.fillStyle = '#fde047';
            ctx.beginPath();
            ctx.arc(0, -17, 5, 0, Math.PI * 2);
            ctx.fill();

            // Arm & Hand (Hand is at local Y = -10, which is Y = -46px relative to ground)
            ctx.strokeStyle = '#fde047';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(0, -10);
            let handX = Math.cos(throwArmAngle - Math.PI / 2) * 10;
            let handY = -10 - Math.sin(throwArmAngle - Math.PI / 2) * 10;
            ctx.lineTo(handX, handY);
            ctx.stroke();

            // Ball in hand before throw
            if (isThrowingAnim) {
                ctx.fillStyle = '#fb7185';
                ctx.beginPath();
                ctx.arc(handX, handY, 4.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            // 4. WHEELS
            const wheelXPositions = [-45, -30, -10, 5, 25, 40, 60, 80];
            wheelXPositions.forEach(wx => drawTrainWheel(wx, -5, dist));

            ctx.restore();
        }

        function drawCoach(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 1.2;
            ctx.strokeRect(x, y, w, h);

            // Windows
            ctx.fillStyle = '#fde047';
            ctx.fillRect(x + 5, y + 6, 7, 9);
            ctx.fillRect(x + 14, y + 6, 7, 9);
            ctx.fillRect(x + 23, y + 6, 7, 9);

            // Joint
            ctx.fillStyle = '#334155';
            ctx.fillRect(x + w, y + h - 11, 4, 6);
        }

        function drawTrainWheel(wx, wy, dist) {
            ctx.save();
            ctx.translate(wx, wy);
            ctx.rotate(dist * 0.15);

            ctx.beginPath();
            ctx.arc(0, 0, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#475569';
            ctx.fill();
            ctx.lineWidth = 1.2;
            ctx.strokeStyle = '#0f172a';
            ctx.stroke();

            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1;
            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                let angle = (i * Math.PI) / 2;
                ctx.lineTo(Math.cos(angle) * 5, Math.sin(angle) * 5);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawArrow(fromX, fromY, toX, toY, color, label) {
            let headlen = 8;
            let dx = toX - fromX;
            let dy = toY - fromY;
            let angle = Math.atan2(dy, dx);

            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
            ctx.fill();

            if (label) {
                ctx.font = 'bold 11px sans-serif';
                ctx.fillText(label, toX + 5, toY - 5);
            }
        }

        function showResult(diff, acceleration) {
            let resBox = document.getElementById('resultBox');
            resBox.style.display = 'block';

            // Boundaries relative to person (X=0)
            let rearTrainMeters = -52.5 / scale; // Rear of train
            let frontTrainMeters = 90.5 / scale;  // Front nose of engine

            if (Math.abs(diff) < 0.8) {
                resBox.className = 'result-banner res-success';
                resBox.innerHTML = '🎯 බෝලය නැවතත් කෙළින්ම ළමයාගේ අතටම පතිත විය!';
            } 
            else if (diff >= rearTrainMeters && diff <= frontTrainMeters) {
                resBox.className = 'result-banner res-roof';
                if (acceleration > 0) {
                    resBox.innerHTML = '⚠️ දුම්රිය ත්වරණය වූ නිසා බෝලය ළමයාගේ අතට නොපැමිණ, දුම්රියේ පසුපස වහලයක් මතට පතිත විය! (&Delta;S = ' + Math.abs(diff).toFixed(1) + 'm)';
                } else {
                    resBox.innerHTML = '⚠️ දුම්රිය මන්දනය වූ නිසා බෝලය ළමයාගේ අතට නොපැමිණ, දුම්රියේ ඉදිරිපස වහලයක් මතට පතිත විය! (&Delta;S = ' + Math.abs(diff).toFixed(1) + 'm)';
                }
            } 
            else if (diff < rearTrainMeters) {
                resBox.className = 'result-banner res-behind';
                resBox.innerHTML = '⚠️ දුම්රිය අධික ලෙස ත්වරණය වූ නිසා බෝලය දුම්රියටත් පිටුපසින් පාරට පතිත විය! (&Delta;S = ' + Math.abs(diff).toFixed(1) + 'm)';
            } 
            else {
                resBox.className = 'result-banner res-behind';
                resBox.innerHTML = '⚠️ දුම්රිය අධික ලෙස මන්දනය වූ නිසා බෝලය දුම්රියටත් ඉදිරියෙන් පාරට පතිත විය! (&Delta;S = ' + Math.abs(diff).toFixed(1) + 'm)';
            }
        }

        function resetSimulation() {
            if (animationFrame) cancelAnimationFrame(animationFrame);
            isRunning = false;
            isThrowingAnim = false;
            throwArmAngle = 0;
            ballTrail = [];
            smokeParticles = [];

            document.getElementById('hud-time').innerText = '0.00 s';
            document.getElementById('hud-ball').innerText = '0.0 m';
            document.getElementById('hud-train').innerText = '0.0 m';
            document.getElementById('hud-diff').innerText = '0.0 m';
            document.getElementById('resultBox').style.display = 'none';

            drawScene(160, 160, handHeightMeters, 0, 0, 0);
        }

        resetSimulation();
    </script>
</body>
