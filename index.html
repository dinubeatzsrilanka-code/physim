<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Motion Simulator Pro - Realistic Van & Ball Motion</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --panel-bg: rgba(15, 23, 42, 0.8);
            --accent-cyan: #38bdf8;
            --accent-green: #4ade80;
            --accent-rose: #f43f5e;
            --accent-amber: #fbbf24;
            --accent-purple: #a855f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at top, #1e1b4b, #0f172a, #020617);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2.1rem;
            font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .main-wrapper {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(2, 6, 23, 0.5);
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .control-item label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent-cyan);
        }

        .control-item input[type="number"] {
            width: 100%;
            padding: 6px 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .control-item input[type="number"]:focus {
            border-color: var(--accent-cyan);
        }

        .toggle-group {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            grid-column: 1 / -1;
            margin-top: 5px;
            flex-wrap: wrap;
        }

        .toggle-label {
            font-size: 0.85rem;
            color: #cbd5e1;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            grid-column: 1 / -1;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-start {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
        }

        .btn-reset {
            background: #334155;
            color: #f1f5f9;
        }

        .btn-reset:hover { background: #475569; }

        .btn-train {
            background: linear-gradient(135deg, #7c3aed, #9333ea);
            color: white;
            box-shadow: 0 4px 15px rgba(147, 51, 234, 0.4);
        }

        .btn-train:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(147, 51, 234, 0.6);
        }

        .canvas-container {
            position: relative;
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }

        canvas {
            width: 100%;
            height: 440px;
            display: block;
            background: #050811;
        }

        .hud-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .hud-card {
            background: rgba(2, 6, 23, 0.6);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .hud-title { font-size: 0.75rem; color: #94a3b8; }
        .hud-val { font-size: 1.1rem; font-weight: 700; color: var(--accent-green); margin-top: 2px; }

        .result-banner {
            display: none;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: 700;
            font-size: 1rem;
            margin-top: 10px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .res-success { background: rgba(34, 197, 94, 0.15); border: 1px solid var(--accent-green); color: var(--accent-green); }
        .res-behind { background: rgba(244, 63, 94, 0.15); border: 1px solid var(--accent-rose); color: #fca5a5; }
        .res-front { background: rgba(251, 191, 36, 0.15); border: 1px solid var(--accent-amber); color: #fde047; }
    </style>
</head>
<body>

    <header>
        <h1>🚐 Physics Motion Simulator Pro</h1>
        <p class="subtitle">චලනය වන වෑන් රථයකින් ඉහළට විසි කරන ලද වස්තුවක සාපේක්ෂ චලිතය</p>
    </header>

    <div class="main-wrapper">
        <div class="glass-panel">
            <div class="controls-grid">
                <div class="control-item">
                    <label for="v_van">වෑන් රථයේ ප්‍රවේගය (m/s)</label>
                    <input type="number" id="v_van" value="35" step="5">
                </div>
                <div class="control-item">
                    <label for="u_y">බෝලයේ සිරස් ප්‍රවේගය (m/s)</label>
                    <input type="number" id="u_y" value="25" step="5">
                </div>
                <div class="control-item">
                    <label for="acc">වෑන් රථයේ ත්වරණය (m/s²)</label>
                    <input type="number" id="acc" value="0" step="1">
                </div>
                <div class="control-item">
                    <label for="gravity">ගුරුත්වජ ත්වරණය g (m/s²)</label>
                    <input type="number" id="gravity" value="10" step="0.5">
                </div>

                <div class="toggle-group">
                    <label class="toggle-label">
                        <input type="checkbox" id="chkVectors" checked> Velocity Vectors පෙන්වන්න
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="chkSound" checked> Sound Effects
                    </label>
                </div>

                <div class="btn-group">
                    <button class="btn-start" onclick="startSimulation()">🚀 Start Simulation</button>
                    <button class="btn-reset" onclick="resetSimulation()">🔄 Reset</button>
                    <button class="btn-train" onclick="goToTrainSimulation()">🚆 දුම්රියක් භාවිතයෙන්</button>
                </div>
            </div>

            <div class="canvas-container" style="margin-top: 15px;">
                <canvas id="simCanvas" width="960" height="440"></canvas>
            </div>

            <div class="hud-grid">
                <div class="hud-card">
                    <div class="hud-title">ගතවූ කාලය (t)</div>
                    <div class="hud-val" id="hud-time">0.00 s</div>
                </div>
                <div class="hud-card">
                    <div class="hud-title">බෝලය ගිය දුර (S<sub>ball</sub>)</div>
                    <div class="hud-val" id="hud-ball">0.0 m</div>
                </div>
                <div class="hud-card">
                    <div class="hud-title">වෑන් රථය ගිය දුර (S<sub>van</sub>)</div>
                    <div class="hud-val" id="hud-van">0.0 m</div>
                </div>
                <div class="hud-card">
                    <div class="hud-title">සාපේක්ෂ දුර (&Delta;S)</div>
                    <div class="hud-val" id="hud-diff">0.0 m</div>
                </div>
            </div>

            <div id="resultBox" class="result-banner"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Audio Context for realistic sound effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function goToTrainSimulation() {
            // 
            window.location.href = 'train.html'; 
        }

        function playSound(type) {
            if (!document.getElementById('chkSound').checked) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'throw') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(650, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                } else if (type === 'land') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(130, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                }
            } catch(e){}
        }

        let animationFrame = null;
        let isRunning = false;
        let ballTrail = [];
        let particles = [];

        // Animation States
        let throwArmAngle = 0;
        let isThrowingAnim = false;

        function startSimulation() {
            if (isRunning) return;

            let v_van_0 = parseFloat(document.getElementById('v_van').value);
            let u_y = parseFloat(document.getElementById('u_y').value);
            let a_van = parseFloat(document.getElementById('acc').value);
            let g = parseFloat(document.getElementById('gravity').value);

            let t = 0;
            let dt = 0.025;
            let scale = 2.2;

            let initialRoofY = 64; 
            let startPos = 120;
            let vanX = startPos;
            let ballX = startPos;
            let ballY = initialRoofY / scale;

            ballTrail = [];
            particles = [];
            document.getElementById('resultBox').style.display = 'none';

            isThrowingAnim = true;
            let armProgress = 0;

            function animate() {
                if (isThrowingAnim) {
                    armProgress += 0.08;
                    // Flipped arm movement direction (throwing right)
                    throwArmAngle = Math.sin(armProgress * Math.PI) * 1.2;

                    if (armProgress >= 0.5 && isThrowingAnim) {
                        playSound('throw');
                    }

                    if (armProgress >= 1.0) {
                        isThrowingAnim = false;
                        isRunning = true;
                    }
                }

                if (isRunning) {
                    throwArmAngle = 0;
                    t += dt;

                    vanX = startPos + (v_van_0 * t + 0.5 * a_van * t * t);
                    ballX = startPos + (v_van_0 * t);
                    let relY = u_y * t - 0.5 * g * t * t;
                    ballY = (initialRoofY / scale) + relY;

                    if (relY >= 0) {
                        ballTrail.push({ x: ballX, y: ballY });
                    }

                  // Exhaust Smoke Particles from rear silencer
if (Math.random() < 0.6) {
    let exhaustWorldX = vanX - (62 / scale); 
    let exhaustWorldY = 4;

    particles.push({
        x: exhaustWorldX,
        y: exhaustWorldY,
        vx: -1.5 - Math.random(),
        vy: 0.2 + Math.random() * 0.3,
        size: 3 + Math.random() * 4,
        alpha: 0.6
    });
}
                    let s_van = v_van_0 * t + 0.5 * a_van * t * t;
                    let s_ball = v_van_0 * t;
                    let diff = s_ball - s_van;

                    document.getElementById('hud-time').innerText = t.toFixed(2) + ' s';
                    document.getElementById('hud-ball').innerText = s_ball.toFixed(1) + ' m';
                    document.getElementById('hud-van').innerText = s_van.toFixed(1) + ' m';
                    document.getElementById('hud-diff').innerText = Math.abs(diff).toFixed(1) + ' m';

                    if (relY < 0 && t > 0.1) {
                        isRunning = false;
                        playSound('land');
                        showResult(diff, a_van);
                    }
                }

                drawScene(vanX, ballX, ballY, t, scale, v_van_0 + a_van * t, u_y - g * t);

                if (isRunning || isThrowingAnim) {
                    animationFrame = requestAnimationFrame(animate);
                }
            }

            animate();
        }

        function drawScene(vanX, ballX, ballY, time, scale, curVanVx, curBallVy) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const groundY = 340;
            const cameraX = Math.max(vanX, ballX) - canvas.width / (2.5 * scale);

            // Realistic Dusk/Sunset Sky Gradient
            let skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
            skyGrad.addColorStop(0, '#0c1021');
            skyGrad.addColorStop(0.4, '#1b1b3a');
            skyGrad.addColorStop(0.75, '#4a154b');
            skyGrad.addColorStop(1, '#ff5e36');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, groundY);

            // Sun Glow
            let sunX = canvas.width - 150 - (cameraX * 0.05);
            let sunGrad = ctx.createRadialGradient(sunX, groundY - 30, 10, sunX, groundY - 30, 90);
            sunGrad.addColorStop(0, 'rgba(254, 215, 170, 0.9)');
            sunGrad.addColorStop(0.5, 'rgba(249, 115, 22, 0.4)');
            sunGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(sunX, groundY - 30, 90, 0, Math.PI * 2);
            ctx.fill();

            // Parallax Layer 1: Distant Mountain Silhouettes
            ctx.fillStyle = '#170c27';
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            for (let i = -50; i <= canvas.width + 50; i += 40) {
                let mtnH = Math.sin((i + cameraX * 0.1) * 0.008) * 55 + 65;
                ctx.lineTo(i, groundY - mtnH);
            }
            ctx.lineTo(canvas.width, groundY);
            ctx.fill();

            // Parallax Layer 2: Trees & City Silhouettes
            ctx.fillStyle = '#0a0518';
            for (let i = -100; i <= 3000; i += 180) {
                let treeX = (i - cameraX * 0.4) * scale;
                if (treeX > -50 && treeX < canvas.width + 50) {
                    ctx.beginPath();
                    ctx.arc(treeX, groundY - 35, 22, 0, Math.PI * 2);
                    ctx.arc(treeX + 15, groundY - 45, 18, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillRect(treeX - 3, groundY - 35, 6, 35);
                }
            }

            // Real-world Streetlights & Light Cones
            for (let i = -200; i <= 3000; i += 250) {
                let lightX = (i - cameraX) * scale;
                if (lightX > -100 && lightX < canvas.width + 100) {
                    // Pole
                    ctx.strokeStyle = '#334155';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(lightX, groundY);
                    ctx.lineTo(lightX, groundY - 110);
                    ctx.lineTo(lightX + 15, groundY - 110);
                    ctx.stroke();

                    // Lamp Head
                    ctx.fillStyle = '#fde047';
                    ctx.beginPath();
                    ctx.arc(lightX + 15, groundY - 110, 4, 0, Math.PI * 2);
                    ctx.fill();

                    // Streetlight Cone
                    let coneGrad = ctx.createLinearGradient(lightX + 15, groundY - 110, lightX + 15, groundY);
                    coneGrad.addColorStop(0, 'rgba(253, 224, 71, 0.25)');
                    coneGrad.addColorStop(1, 'transparent');
                    ctx.fillStyle = coneGrad;
                    ctx.beginPath();
                    ctx.moveTo(lightX + 15, groundY - 110);
                    ctx.lineTo(lightX - 45, groundY);
                    ctx.lineTo(lightX + 75, groundY);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            // Road Structure
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

            // Curb
            ctx.fillStyle = '#334155';
            ctx.fillRect(0, groundY, canvas.width, 6);

            // Road Lane Dividers
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 3;
            ctx.setLineDash([35, 25]);
            ctx.lineDashOffset = -(cameraX * scale) % 60;
            ctx.beginPath();
            ctx.moveTo(0, groundY + 45);
            ctx.lineTo(canvas.width, groundY + 45);
            ctx.stroke();
            ctx.setLineDash([]);

            // Distance Markers
            ctx.fillStyle = '#64748b';
            ctx.font = '600 11px sans-serif';
            for (let m = 0; m <= 3000; m += 20) {
                let screenX = (m - cameraX) * scale;
                if (screenX >= -20 && screenX <= canvas.width + 20) {
                    ctx.fillRect(screenX, groundY + 6, 2, 8);
                    ctx.fillText(m + 'm', screenX - 8, groundY + 28);
                }
            }

            // Smoke Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.015;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                let px = (p.x - cameraX) * scale;
                let py = groundY - (p.y * scale);
                ctx.fillStyle = `rgba(203, 213, 225, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(px, py, p.size, 0, Math.PI * 2);
                ctx.fill();
            }

            // Trajectory Trail
            if (ballTrail.length > 1) {
                ctx.beginPath();
                ctx.strokeStyle = '#f43f5e';
                ctx.lineWidth = 3;
                ctx.setLineDash([5, 5]);
                for (let i = 0; i < ballTrail.length; i++) {
                    let ptX = (ballTrail[i].x - cameraX) * scale;
                    let ptY = groundY - (ballTrail[i].y * scale);
                    if (i === 0) ctx.moveTo(ptX, ptY);
                    else ctx.lineTo(ptX, ptY);
                }
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Draw Flipped HiAce Van & Boy (Facing RIGHT)
            let vanScreenX = (vanX - cameraX) * scale;
            let vanScreenY = groundY - 10;
            drawRealisticHiAceVan(vanScreenX, vanScreenY, vanX, isThrowingAnim || isRunning);

            // Draw Ball
            let ballScreenX = (ballX - cameraX) * scale;
            let ballScreenY = groundY - (ballY * scale);

            if (ballY >= 0) {
                ctx.shadowColor = '#f43f5e';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(ballScreenX, ballScreenY, 8.5, 0, Math.PI * 2);
                ctx.fillStyle = '#fb7185';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#fff';
                ctx.stroke();
                ctx.shadowBlur = 0;

                if (document.getElementById('chkVectors').checked && isRunning) {
                    let v_van_0 = parseFloat(document.getElementById('v_van').value);
                    drawArrow(ballScreenX, ballScreenY, ballScreenX + v_van_0 * 0.8, ballScreenY, '#38bdf8', 'Vx');
                    drawArrow(ballScreenX, ballScreenY, ballScreenX, ballScreenY - curBallVy * 0.8, '#4ade80', 'Vy');
                }
            }
        }

        // --- FLIPPED HIACE VAN DRAWING (FACING RIGHT) ---
        function drawRealisticHiAceVan(x, y, dist, isMoving) {
            ctx.save();
            ctx.translate(x, y);

            // Headlight Beam Light (Flipped - facing RIGHT)
            let headlightGlow = ctx.createRadialGradient(65, -18, 5, 170, -18, 90);
            headlightGlow.addColorStop(0, 'rgba(253, 224, 71, 0.5)');
            headlightGlow.addColorStop(1, 'rgba(253, 224, 71, 0)');
            ctx.fillStyle = headlightGlow;
            ctx.beginPath();
            ctx.moveTo(65, -28);
            ctx.lineTo(190, -5);
            ctx.lineTo(190, 10);
            ctx.lineTo(65, -8);
            ctx.closePath();
            ctx.fill();

            // --- ANIMATED BOY IN ROOF HATCH ---
            ctx.save();
            ctx.translate(5, -54); // Hatch position

            // Boy Body
            ctx.fillStyle = '#2563eb';
            ctx.fillRect(-7, 10, 14, 12);

            // Boy Head
            ctx.fillStyle = '#fde047';
            ctx.beginPath();
            ctx.arc(0, 2, 7, 0, Math.PI * 2);
            ctx.fill();

            // Boy Arm (Throwing to the RIGHT)
            ctx.strokeStyle = '#fde047';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.moveTo(-2, 12);
            let handX = -2 + Math.cos(throwArmAngle - 0.5) * 14;
            let handY = 12 - Math.sin(throwArmAngle - 0.5) * 14;
            ctx.lineTo(handX, handY);
            ctx.stroke();

            if (isThrowingAnim) {
                ctx.fillStyle = '#fb7185';
                ctx.beginPath();
                ctx.arc(handX, handY, 6, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            // --- TOYOTA HIACE / KDH VAN BODY ---
            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            ctx.moveTo(-65, -52); 
            ctx.lineTo(35, -52);  
            ctx.lineTo(65, -20);  
            ctx.lineTo(67, -8);   
            ctx.lineTo(67, -2);   
            ctx.lineTo(-65, -2);  
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Roof Hatch Cutout
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(-5, -53, 20, 3);

            // HiAce Side Windows
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.moveTo(-58, -45);
            ctx.lineTo(30, -45);
            ctx.lineTo(56, -22);
            ctx.lineTo(56, -18);
            ctx.lineTo(-58, -18);
            ctx.closePath();
            ctx.fill();

            // Sliding Door Track Line
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-35, -15);
            ctx.lineTo(15, -15);
            ctx.stroke();

            // Side Skirt Kit Line
            ctx.fillStyle = '#e2e8f0';
            ctx.fillRect(-65, -5, 132, 4);

            // Headlight Assembly
            ctx.fillStyle = '#fde047';
            ctx.fillRect(62, -22, 5, 12);
            ctx.strokeStyle = '#0f172a';
            ctx.strokeRect(62, -22, 5, 12);

            // Taillight Assembly
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(-66, -30, 3, 18);

            // Side Mirror
            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(45, -22, 6, 5);

            // Wheels
            drawKDHAlloyWheel(-35, 0, dist);
            drawKDHAlloyWheel(35, 0, dist);

            ctx.restore();
        }

        function drawKDHAlloyWheel(wx, wy, dist) {
            ctx.save();
            ctx.translate(wx, wy);
            ctx.rotate(dist * 0.12);

            ctx.beginPath();
            ctx.arc(0, 0, 14, 0, Math.PI * 2);
            ctx.fillStyle = '#1e293b';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#0f172a';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 0, 9, 0, Math.PI * 2);
            ctx.fillStyle = '#94a3b8';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(0, 0, 3, 0, Math.PI * 2);
            ctx.fillStyle = '#0f172a';
            ctx.fill();

            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 1.8;
            for (let i = 0; i < 6; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                let angle = (i * Math.PI * 2) / 6;
                ctx.lineTo(Math.cos(angle) * 9, Math.sin(angle) * 9);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawArrow(fromX, fromY, toX, toY, color, label) {
            let headlen = 8;
            let dx = toX - fromX;
            let dy = toY - fromY;
            let angle = Math.atan2(dy, dx);

            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
            ctx.fill();

            if (label) {
                ctx.font = 'bold 11px sans-serif';
                ctx.fillText(label, toX + 5, toY - 5);
            }
        }

        function showResult(diff, acceleration) {
            let resBox = document.getElementById('resultBox');
            resBox.style.display = 'block';

            if (Math.abs(diff) < 0.6) {
                resBox.className = 'result-banner res-success';
                resBox.innerHTML = '🎯 බෝලය නැවතත් වෑන් රථය තුළටම (ළමයාගේ අතටම) පතිත විය!';
            } else if (acceleration > 0) {
                resBox.className = 'result-banner res-behind';
                resBox.innerHTML = '⚠️ වෑන් රථය ත්වරණය වූ නිසා බෝලය වෑන් රථයට පසුපසින් වැටුණි! (&Delta;S = ' + Math.abs(diff).toFixed(1) + 'm)';
            } else {
                resBox.className = 'result-banner res-front';
                resBox.innerHTML = '⚠️ වෑන් රථය මන්දනය වූ නිසා බෝලය වෑන් රථයට ඉදිරියෙන් වැටුණි! (&Delta;S = ' + Math.abs(diff).toFixed(1) + 'm)';
            }
        }

        function resetSimulation() {
            if (animationFrame) cancelAnimationFrame(animationFrame);
            isRunning = false;
            isThrowingAnim = false;
            throwArmAngle = 0;
            ballTrail = [];
            particles = [];

            document.getElementById('hud-time').innerText = '0.00 s';
            document.getElementById('hud-ball').innerText = '0.0 m';
            document.getElementById('hud-van').innerText = '0.0 m';
            document.getElementById('hud-diff').innerText = '0.0 m';
            document.getElementById('resultBox').style.display = 'none';

            drawScene(120, 120, 64 / 2.2, 0, 2.2, 0, 0);
        }

        resetSimulation();
    </script>
</body>
